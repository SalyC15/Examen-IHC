<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Pruebas CaféU</title><style>body{font:16px system-ui;max-width:760px;margin:3rem auto;padding:0 1rem;color:#173b32}li{margin:.8rem 0}.pass{color:#226334}.fail{color:#a32222}</style></head>
<body><h1>Pruebas funcionales de dominio</h1><p>Ejecuta estos casos abriendo este archivo en un navegador moderno.</p><ol id="results"></ol><p id="summary" aria-live="polite"></p><script type="module">
import { products } from '../src/products.js';
import { filterProducts, cartSummary } from '../src/domain.js';
const cases = [
  ['Filtro por categoría', () => {
    const found = filterProducts(products, 'Café', '');
    if (!found.length || found.some((product) => product.category !== 'Café')) throw new Error('Incluyó productos de otra categoría o no encontró café.');
  }],
  ['Búsqueda ignora tildes y mayúsculas', () => {
    const found = filterProducts(products, 'Todo', 'SANDUCHE');
    if (!found.some((product) => product.id === 'sandwich')) throw new Error('No encontró “Sánduche” con una consulta sin tilde.');
  }],
  ['Cantidad y total del carrito', () => {
    const coffee = products.find((product) => product.id === 'latte');
    const summary = cartSummary({ latte: 2 }, products);
    if (summary.count !== 2 || summary.total !== coffee.price * 2) throw new Error('El total no corresponde a dos unidades.');
  }],
  ['Ignora cantidad inválida y producto desconocido', () => {
    const summary = cartSummary({ latte: -1, unknown: 3 }, products);
    if (summary.count !== 0 || summary.total !== 0) throw new Error('Incluyó un producto o cantidad inválida.');
  }],
];
let failures = 0;
for (const [name, test] of cases) {
  const item = document.createElement('li');
  try { test(); item.className = 'pass'; item.textContent = `PASS — ${name}`; }
  catch (error) { failures++; item.className = 'fail'; item.textContent = `FAIL — ${name}: ${error.message}`; }
  document.querySelector('#results').append(item);
}
document.querySelector('#summary').textContent = `${cases.length - failures}/${cases.length} pruebas aprobadas.`;
</script></body></html>
